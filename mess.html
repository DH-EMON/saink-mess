<script>

var BD="০১২৩৪৫৬৭৮৯";
function toBn(s){return String(s).replace(/[0-9]/g,function(d){return BD.charAt(+d)})}

});
T.innerHTML=h;
T.querySelectorAll(".in").forEach(function(e){var i=+e.dataset.i;e.value=S.items[i].n;e.oninput=function(){S.items[i].n=this.value;save()}});
T.querySelectorAll(".ir").forEach(function(e){var i=+e.dataset.i;e.value=rf(S.items[i].r);
e.oninput=function(){var p=toBn(this.value.replace(/[^0-9০-৯.]/g,""));if(p!==this.value)this.value=p;S.items[i].r=num(p);calc();save()};
e.onfocus=function(){var t=this;setTimeout(function(){try{if(document.activeElement===t)t.select()}catch(x){}},30)};
e.onblur=function(){this.value=rf(S.items[i].r)}});
T.querySelectorAll(".dl").forEach(function(b){b.onclick=function(){var i=+this.dataset.i;if(confirm("\""+S.items[i].n+"\" মুছবেন?")){S.items.splice(i,1);save();build()}}});
calc();
}
function tot(){var s=0;S.items.forEach(function(it){s+=E()*it.r});return s}
function calc(){var mj=document.getElementById("mj");if(mj)mj.textContent=toBn(E());var te=document.getElementById("tot");if(te)te.textContent=f(tot());S.items.forEach(function(it,i){var a=document.getElementById("j"+i),b=document.getElementById("r"+i);if(a)a.textContent=toBn(E());if(b)b.textContent=f(E()*it.r)})}
var DP=[["fd","fm","fy"],["td","tm","ty"]];
(function(){var d='<option value="">দিন</option>',m='<option value="">মাস</option>',y="";
for(var i=1;i<=31;i++)d+='<option value="'+i+'">'+toBn(i)+'</option>';
MN.forEach(function(n,i){m+='<option value="'+(i+1)+'">'+toBn(i+1)+' - '+n+'</option>'});
for(var k=2020;k<=2045;k++)y+='<option value="'+k+'">'+toBn(k)+'</option>';
DP.forEach(function(g){var a=document.getElementById(g[0]),b=document.getElementById(g[1]),c=document.getElementById(g[2]);a.innerHTML=d;b.innerHTML=m;c.innerHTML=y;
[a,b,c].forEach(function(el,j){el.onchange=function(){S[g[j]]=this.value;save();head()}})});
var u="";for(var q=1;q<=31;q++)u+='<option value="'+q+'">'+toBn(q)+'</option>';mul.innerHTML=u})();

jin.oninput=function(){var p=toBn(this.value.replace(/[^0-9০-৯]/g,""));if(p!==this.value)this.value=p;S.jon=parseInt(toEn(p))||0;calc();save()};

jin.onblur=function(){this.value=toBn(S.jon)};

var PVURL="";
function mkPdf(){
var sc=2,pad=16,cwid=[50,190,110,150,150,150],rh=36,hh=44,W=pad*2+cwid.reduce(function(a,b){return a+b},0),n=S.items.length;

x.textAlign="center";x.fillStyle="#111";fit(ttlTxt(),W-2*pad,20,true);x.fillText(ttlTxt(),W/2,pad+16);

var y=pad+112,heads=["ক্র/নং","আইটেম","জনবল","× হার","= পরিমাণ (কেজি)","মোট পরিমাণ (কেজি)"],xx=pad;
heads.forEach(function(t,i){box(xx,y,cwid[i],hh,PL);x.fillStyle="#111";fit(t,cwid[i]-8,14,true);x.fillText(t,xx+cwid[i]/2,y+hh/2);xx+=cwid[i]});
y+=hh;var ys=y;
S.items.forEach(function(it,i){
var cells=[toBn(i+1)+"।",it.n,toBn(E()),rf(it.r),f(E()*it.r)];xx=pad;
cells.forEach(function(t,k){box(xx,y,cwid[k],rh,k==4?PL:null);x.fillStyle=k==3||k==4?"#c0201a":"#111";x.textAlign=k==1?"left":"center";fit(t,cwid[k]-12,14,k==1||k==4);x.fillText(t,k==1?xx+8:xx+cwid[k]/2,y+rh/2);xx+=cwid[k]});
x.textAlign="center";y+=rh;
});

x.fillStyle="#555";x.font="12px "+FF;x.textAlign="center";x.fillText("Create by Ocu Emon",W/2,H-pad-2);
var b64=cv.toDataURL("image/jpeg",0.92).split(",")[1];PVURL="data:image/jpeg;base64,"+b64;
var bin=atob(b64),jpg=new Uint8Array(bin.length);for(var q=0;q<bin.length;q++)jpg[q]=bin.charCodeAt(q);
var pw=Math.round(W*0.75),ph=Math.round(H*0.75),enc=new TextEncoder(),parts=[],off=[],len=0;
function add(bb){if(typeof bb=="string")bb=enc.encode(bb);parts.push(bb);len+=bb.length}
function obj(k,head,st){off[k]=len;add(k+" 0 obj\n"+head+"\n");if(st){add("stream\n");add(st);add("\nendstream\n")}add("endobj\n")}
add("%PDF-1.4\n");

}
